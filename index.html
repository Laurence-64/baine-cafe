<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BaïNE Café — Soulac sur Mer · Menu</title>
<meta name="description" content="Carte du BaïNE Café, Soulac sur Mer.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Montserrat:wght@600;700;800&family=Open+Sans:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
/* ============================================================
   👉 1. TES LIENS : voir le bloc LINKS tout en bas dans le <script>
   ============================================================ */
:root{
  --cobalt:#1b50a3;        /* bleu logo + vagues */
  --ink:#1a1a1a;           /* titres + prix (noir comme le PDF) */
  --muted:#5d6b7e;         /* descriptions */
  --squiggle:#3a4a5e;      /* fine vague des titres */
  --line:#e9e9e9;
  --bg:#ffffff;            /* fond blanc comme le PDF */
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Open Sans",system-ui,sans-serif;font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}

/* ---------- Barre langue (discrète) ---------- */
.topbar{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.topbar-in{max-width:920px;margin:0 auto;padding:8px 18px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.mini-brand{font-family:"Fredoka",sans-serif;font-weight:600;font-size:16px;color:var(--cobalt)}
.topbar .right{display:flex;align-items:center;gap:10px}
.tabbar-in{max-width:920px;margin:0 auto;display:flex;gap:6px;padding:2px 12px 8px;overflow-x:auto;scrollbar-width:none}
.tabbar-in::-webkit-scrollbar{display:none}
.tab{flex:none;border:0;background:transparent;cursor:pointer;font-family:"Montserrat",sans-serif;font-weight:700;font-size:13.5px;color:var(--muted);padding:7px 15px;border-radius:999px;white-space:nowrap;transition:.15s}
.tab:hover{color:var(--cobalt)}
.tab[aria-selected="true"]{background:var(--cobalt);color:#fff}
.tab:focus-visible{outline:3px solid var(--cobalt);outline-offset:2px}
.page{display:none}
.page.active{display:block}
.langs{display:flex;gap:3px;background:#f4f6f9;border:1px solid var(--line);border-radius:999px;padding:3px}
.langs button{border:0;background:transparent;cursor:pointer;font-family:"Montserrat",sans-serif;font-weight:700;font-size:12.5px;letter-spacing:.03em;color:var(--muted);padding:6px 11px;border-radius:999px;transition:.15s}
.langs button:hover{color:var(--cobalt)}
.langs button[aria-pressed="true"]{background:var(--cobalt);color:#fff}
.langs button:focus-visible,.printbtn:focus-visible{outline:3px solid var(--cobalt);outline-offset:2px}
.printbtn{border:1px solid var(--line);background:#fff;border-radius:999px;cursor:pointer;font-family:"Montserrat",sans-serif;font-weight:700;font-size:12.5px;color:var(--cobalt);padding:7px 13px}
.printbtn:hover{border-color:var(--cobalt)}

/* ---------- Logo ---------- */
.hero{text-align:center;padding:30px 20px 4px}
.logo-img{width:210px;max-width:60vw;height:auto;display:inline-block}
/* rond provisoire (remplacé par ton PNG) */
.logo-fallback{width:188px;height:188px;max-width:60vw;border-radius:50%;background:var(--cobalt);display:inline-grid;place-items:center;color:#fff;text-align:center}
.logo-fallback .n{font-family:"Fredoka",sans-serif;font-weight:600;font-size:30px;line-height:1}
.logo-fallback .s{font-family:"Open Sans",sans-serif;font-weight:700;font-size:12px;letter-spacing:.12em;margin-top:8px}

/* ---------- Sections ---------- */
main{max-width:920px;margin:0 auto;padding:18px 22px 10px}
.sec{margin:0 0 40px;break-inside:avoid}
.sec-head{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:18px;margin-bottom:16px}
.sec-head h2{font-family:"Montserrat",sans-serif;font-weight:800;font-size:clamp(20px,4.6vw,27px);color:var(--ink);text-align:center;margin:0}
.sec-price{font-family:"Montserrat",sans-serif;font-weight:800;font-size:clamp(15px,3.6vw,19px);color:var(--ink);white-space:nowrap;justify-self:end}
.sq{display:inline-flex;color:var(--squiggle)}
.sq svg{width:78px;height:18px}
@media(max-width:560px){.sq svg{width:46px}.sec-head{gap:10px}}

.cols2{column-count:2;column-gap:46px}
@media(max-width:600px){.cols2{column-count:1}}

.item{break-inside:avoid;padding:6px 0}
.lead{display:flex;align-items:baseline;gap:8px}
.name{font-weight:700;color:var(--ink)}
.dots{flex:1;border-bottom:1px dotted #c9d0d8;transform:translateY(-3px);min-width:12px}
.price{font-weight:700;color:var(--ink);white-space:nowrap}
.desc{font-size:12.5px;color:var(--muted);margin-top:1px;max-width:48ch}

/* brunch : lignes simples 2 colonnes, sans puce, sans prix */
.fitem{break-inside:avoid;padding:5px 0;color:var(--ink);font-size:15.5px}

/* tableaux bières / vins */
.tbl{width:100%;border-collapse:collapse;margin-top:2px}
.tbl th{font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-weight:700;text-align:right;padding:0 0 8px 10px}
.tbl th:first-child{text-align:left}
.tbl td{padding:7px 0 7px 10px;border-top:1px solid #efefef;vertical-align:baseline}
.tbl td:first-child{padding-left:0}
.tbl td.p{text-align:right;font-weight:700;color:var(--ink);white-space:nowrap}
.tbl .nm{font-weight:700}
.tbl .ap{display:block;font-size:11.5px;color:var(--muted);font-weight:600}

/* ---------- Vagues bas ---------- */
.bottomwave{max-width:920px;margin:6px auto 0;padding:0 22px;text-align:center;color:var(--cobalt)}
.bottomwave svg,.bottomwave img{width:240px;max-width:74%;height:auto;display:inline-block}

/* ---------- Pied / liens ---------- */
footer{max-width:920px;margin:0 auto;padding:24px 22px 46px;text-align:center}
.links{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.links a{color:var(--cobalt);background:#fff;border:2px solid var(--cobalt);text-decoration:none;font-family:"Montserrat",sans-serif;font-weight:700;font-size:13.5px;padding:9px 18px;border-radius:999px;transition:.15s}
.links a:hover{background:var(--cobalt);color:#fff}
.foot-meta{margin-top:18px;font-size:12px;color:var(--muted)}

@media(prefers-reduced-motion:reduce){*{animation:none!important}}

/* ---------- Écran d'accueil ---------- */
#cover{position:fixed;inset:0;z-index:100;background:var(--cobalt);display:flex;align-items:center;justify-content:center;padding:20px;overflow:auto;transition:opacity .4s}
#cover.hidden{opacity:0;pointer-events:none}
.cover-card{background:#fff;border-radius:24px;max-width:430px;width:100%;padding:16px 16px 22px;text-align:center;box-shadow:0 30px 70px -30px rgba(0,0,0,.55)}
.cover-img{width:100%;height:auto;border-radius:16px;display:block}
.cover-tag{font-weight:700;color:var(--ink);margin:16px 6px 2px;font-size:14px}
.cover-choose{color:var(--muted);font-size:12px;letter-spacing:.05em;text-transform:uppercase;font-weight:700;margin:16px 0 10px}
.cover-langs{display:grid;gap:8px}
.cv-lang{display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:#fff;border-radius:12px;padding:12px 16px;font-family:"Montserrat",sans-serif;font-weight:700;font-size:15px;color:var(--cobalt);cursor:pointer;transition:.15s}
.cv-lang:hover{background:var(--cobalt);color:#fff;border-color:var(--cobalt)}
.cv-lang .fl{font-size:20px}
.cv-lang:focus-visible{outline:3px solid #fff;outline-offset:2px}
/* ---------- Onglet Allergènes ---------- */
.ally{max-width:520px;margin:6px auto;text-align:center;padding:34px 14px}
.ally h2{font-family:"Montserrat",sans-serif;font-weight:800;font-size:24px;color:var(--ink);margin:0 0 12px}
.ally p{color:var(--muted);font-size:15px;line-height:1.55;margin:0 auto 24px;max-width:42ch}
.ally-btn{display:inline-block;background:var(--cobalt);color:#fff;text-decoration:none;font-family:"Montserrat",sans-serif;font-weight:700;font-size:14.5px;padding:13px 26px;border-radius:999px}
.ally-btn:hover{background:#143c7c}
/* drapeaux + crédit */
.langs button{padding:5px 8px}
.flag{display:inline-flex;width:24px;height:16px;border-radius:3px;overflow:hidden;box-shadow:0 0 0 1px rgba(0,0,0,.15);vertical-align:middle}
.flag svg{width:100%;height:100%;display:block}
.mini-logo{height:34px;width:auto;display:block}
.cv-lang .flag{width:30px;height:20px}
.credit{display:inline-block;margin-top:6px;font-size:11px;color:var(--muted);opacity:.85}
/* page allergènes */
.allbox{max-width:880px;margin:0 auto}
.allbox h2{font-family:"Montserrat",sans-serif;font-weight:800;font-size:25px;text-align:center;margin:4px 0 8px;color:var(--ink)}
.all-disc{text-align:center;color:var(--muted);font-size:12.5px;max-width:58ch;margin:0 auto 22px;line-height:1.5}
.asec{margin:0 0 22px;break-inside:avoid}
.asec h3{font-family:"Montserrat",sans-serif;font-weight:700;font-size:15px;color:var(--cobalt);margin:0 0 8px;border-bottom:1px solid var(--line);padding-bottom:5px}
.aitem{break-inside:avoid;padding:7px 0;border-top:1px solid #f4f4f4}
.aname{font-weight:700;font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:4px}
.chip{font-size:11px;font-weight:700;color:var(--cobalt);background:#eef3fb;border:1px solid #d6e2f4;border-radius:999px;padding:2px 9px}
.chip-warn{color:#9a5b00;background:#fff4e0;border-color:#f0d9a8}


/* ---------- Impression / PDF ---------- */
@media print{
  .topbar,#cover{display:none!important}
  .page{display:block!important}
  .page+.page{page-break-before:always}
  .sec{page-break-inside:avoid}
  .links a{border:1px solid var(--cobalt)}
  @page{margin:13mm}
}
</style>
</head>

/* ===== Rendu ===== */
let lang = "fr";
let page = 0;
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const t = f => (f && typeof f === "object" && !Array.isArray(f)) ? (f[lang] ?? f.fr) : f;

function head(s){
  const price = s.tag ? eur(s.tag) : "";
  return `<div class="sec-head"><span class="sq" aria-hidden="true">${SQ}</span><h2>${esc(t(s.title))}</h2><span class="sec-price">${price}</span></div>`;
}
function renderFormula(s){
  const lis = s.items.map(it=>`<div class="fitem">${esc(t(it))}</div>`).join("");
  return `<div class="sec">${head(s)}<div class="cols2">${lis}</div></div>`;
}
function renderList(s){
  const rows = s.items.map(it=>{
    const nm = esc(t(it.name));
    const lead = it.price
      ? `<div class="lead"><span class="name">${nm}</span><span class="dots"></span><span class="price">${eur(it.price)}</span></div>`
      : `<div class="lead"><span class="name">${nm}</span></div>`;
    const desc = it.desc ? `<div class="desc">${esc(t(it.desc))}</div>` : "";
    return `<div class="item">${lead}${desc}</div>`;
  }).join("");
  return `<div class="sec">${head(s)}<div class="cols2">${rows}</div></div>`;
}
function renderTable(s){
  const cols = s.cols[lang] ?? s.cols.fr;
  const th = cols.map(c=>`<th>${esc(c)}</th>`).join("");
  const body = s.rows.map(r=>{
    const ap = r.ap ? `<span class="ap">${esc(t(r.ap))}</span>` : "";
    const cells = cols.map((_,i)=>`<td class="p">${r.prices[i] ? eur(r.prices[i]) : ""}</td>`).join("");
    return `<tr><td class="nm">${esc(r.name)}${ap}</td>${cells}</tr>`;
  }).join("");
  return `<div class="sec">${head(s)}<table class="tbl"><thead><tr><th></th>${th}</tr></thead><tbody>${body}</tbody></table></div>`;
}

function chip(code){return `<span class="chip${code==="tbc"?" chip-warn":""}">${esc(t(AL[code]))}</span>`;}
function renderAllergens(){
  const secs=ALLERG.map(s=>{
    const items=s.items.map(it=>`<div class="aitem"><div class="aname">${esc(t(it.n))}</div><div class="chips">${it.a.map(chip).join("")}</div></div>`).join("");
    return `<div class="asec"><h3>${esc(t(s.t))}</h3><div class="cols2">${items}</div></div>`;
  }).join("");
  return `<div class="allbox"><h2>${esc(t(UI.allTitle))}</h2><p class="all-disc">${esc(t(UI.allDisc))}</p>${secs}</div>`;
}

function renderMenu(){
  let pagesHtml = GROUPS.map((g,i)=>
    `<section class="page${i===page?' active':''}" data-page="${i}">`+
    g.sections.map(s=> s.type==="formula"?renderFormula(s): s.type==="table"?renderTable(s): renderList(s)).join("")+
    `</section>`
  ).join("");
  const ai = GROUPS.length;
  pagesHtml += `<section class="page${ai===page?' active':''}" data-page="${ai}">`+renderAllergens()+`</section>`;
  document.getElementById("menu").innerHTML = pagesHtml;

  document.getElementById("tabs").innerHTML = PAGES.map((p,i)=>
    `<button class="tab" type="button" role="tab" data-p="${i}" aria-selected="${i===page}">${esc(t(p))}</button>`
  ).join("");

  document.querySelectorAll("[data-ui]").forEach(el=>{ el.textContent = t(UI[el.dataset.ui]); });
  document.getElementById("links").innerHTML =
    `<a href="${esc(LINKS.instagram)}" target="_blank" rel="noopener">${esc(t(UI.lInsta))}</a>`+
    `<a href="${esc(LINKS.facebook)}" target="_blank" rel="noopener">${esc(t(UI.lFb))}</a>`+
    `<a href="${esc(LINKS.googleAvis)}" target="_blank" rel="noopener">${esc(t(UI.lGoogle))}</a>`;
  document.documentElement.lang = lang;
  document.querySelectorAll("#langs button").forEach(b=>b.setAttribute("aria-pressed", String(b.dataset.l===lang)));
}

const FLAGS = {
 fr:'<svg viewBox="0 0 3 2" preserveAspectRatio="none"><rect width="3" height="2" fill="#fff"/><rect width="1" height="2" fill="#0055A4"/><rect width="1" height="2" x="2" fill="#EF4135"/></svg>',
 en:'<svg viewBox="0 0 60 30"><rect width="60" height="30" fill="#012169"/><path d="M0,0 L60,30 M60,0 L0,30" stroke="#fff" stroke-width="6"/><path d="M0,0 L60,30 M60,0 L0,30" stroke="#C8102E" stroke-width="3"/><rect x="25" width="10" height="30" fill="#fff"/><rect y="10" width="60" height="10" fill="#fff"/><rect x="27" width="6" height="30" fill="#C8102E"/><rect y="12" width="60" height="6" fill="#C8102E"/></svg>',
 de:'<svg viewBox="0 0 5 3" preserveAspectRatio="none"><rect width="5" height="3" fill="#FFCE00"/><rect width="5" height="2" fill="#DD0000"/><rect width="5" height="1" fill="#000"/></svg>',
 nl:'<svg viewBox="0 0 9 6" preserveAspectRatio="none"><rect width="9" height="6" fill="#fff"/><rect width="9" height="2" fill="#AE1C28"/><rect width="9" height="2" y="4" fill="#21468B"/></svg>',
 es:'<svg viewBox="0 0 4 2" preserveAspectRatio="none"><rect width="4" height="2" fill="#AA151B"/><rect width="4" height="1" y="0.5" fill="#F1BF00"/></svg>'
};
const LBL = {fr:"Français",en:"English",de:"Deutsch",nl:"Nederlands",es:"Español"};
document.getElementById("langs").innerHTML = LANGS.map(l=>`<button type="button" data-l="${l}" aria-label="${LBL[l]}" title="${LBL[l]}"><span class="flag">${FLAGS[l]}</span></button>`).join("");
document.getElementById("langs").addEventListener("click", e=>{
  const b=e.target.closest("button"); if(!b) return;
  lang=b.dataset.l; renderMenu(); window.scrollTo({top:0,behavior:"smooth"});
});
document.getElementById("tabs").addEventListener("click", e=>{
  const b=e.target.closest(".tab"); if(!b) return;
  page=Number(b.dataset.p);
  document.querySelectorAll(".page").forEach((el,i)=>el.classList.toggle("active",i===page));
  document.querySelectorAll("#tabs .tab").forEach((el,i)=>el.setAttribute("aria-selected",String(i===page)));
  window.scrollTo({top:0,behavior:"smooth"});
});
document.getElementById("printbtn").addEventListener("click", ()=>window.print());

const COVER_ORDER=["fr","en","de","es","nl"];
function buildCover(){
  document.getElementById("cover-tag").textContent=t(UI.tagline);
  document.getElementById("cover-choose").textContent=t(UI.chooseLang);
  document.getElementById("cover-langs").innerHTML=COVER_ORDER.map(l=>`<button type="button" class="cv-lang" data-l="${l}"><span class="flag">${FLAGS[l]}</span> ${esc(UI.enter[l])}</button>`).join("");
}
function enter(l){lang=l;renderMenu();const c=document.getElementById("cover");c.classList.add("hidden");setTimeout(()=>{c.style.display="none";},450);}
document.getElementById("cover-langs").addEventListener("click",e=>{const b=e.target.closest(".cv-lang");if(!b)return;enter(b.dataset.l);});

// Ouverture directe : ?lang=fr (ou #fr) ouvre direct sur la langue, sans l'écran d'accueil
const params=new URLSearchParams(location.search);
const direct=(params.get("lang")||location.hash.replace(/^#/,"")||"").toLowerCase();
const nav=(navigator.language||"fr").slice(0,2).toLowerCase();
if(LANGS.includes(direct)) lang=direct;
else if(LANGS.includes(nav)) lang=nav;
renderMenu();
buildCover();
if(LANGS.includes(direct)){ document.getElementById("cover").style.display="none"; }
</script>
